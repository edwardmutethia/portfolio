    <g font-family="monospace" font-size="18">
      <text x="132" y="264" fill="#70877D">01</text><text x="186" y="264" fill="#D8E9E0">int <tspan fill="#72D9A9">bst_insert</tspan>(node *root, int value)</text>
      <text x="132" y="306" fill="#70877D">02</text><text x="186" y="306" fill="#D8E9E0">{</text>
      <text x="132" y="348" fill="#70877D">03</text><text x="232" y="348" fill="#D8E9E0">if (root == NULL)</text>
      <text x="132" y="390" fill="#70877D">04</text><text x="232" y="390" fill="#D8E9E0">return <tspan fill="#72D9A9">node_new</tspan>(value);</text>
      <text x="132" y="432" fill="#70877D">05</text><text x="232" y="432" fill="#D8E9E0">if (value &lt; root-&gt;value)</text>
      <text x="132" y="474" fill="#70877D">06</text><text x="278" y="474" fill="#D8E9E0">root-&gt;left = <tspan fill="#72D9A9">bst_insert</tspan>(root-&gt;left, value);</text>
      <text x="132" y="516" fill="#70877D">07</text><text x="232" y="516" fill="#D8E9E0">else if (value &gt; root-&gt;value)</text>
      <text x="132" y="558" fill="#70877D">08</text><text x="278" y="558" fill="#D8E9E0">root-&gt;right = <tspan fill="#72D9A9">bst_insert</tspan>(root-&gt;right, value);</text>
      <text x="132" y="600" fill="#70877D">09</text><text x="232" y="600" fill="#D8E9E0">return root;</text>
      <text x="132" y="642" fill="#70877D">10</text><text x="186" y="642" fill="#D8E9E0">}</text>
    </g>
